<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>양지애 자기소개</title>

  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <main class="card">
    <header>
      <h1>양지애</h1>
      <p>디지털미디어학과 23학번 양지애입니다.</p>
    </header>

    <section>
      <h2>배우고 싶은 기술</h2>
      <ul class="skills">
        <li>Spring Boot</li>
        <li>React</li>
        <li>JavaScript</li>
        <li>Docker</li>
      </ul>
    </section>

    <section>
      <h2>이미지</h2>
      <img
        src="https://picsum.photos/600/400"
        alt="자기소개 페이지에 사용하는 예시 이미지"
      >
    </section>

    <section>
      <h2>자주 방문하는 사이트</h2>
      <a href="https://github.com/" target="_blank">GitHub 바로가기</a>
    </section>

    <section>
      <h2>버튼</h2>
      <p id="message">버튼을 눌러 주세요.</p>
      <button id="greeting-button" type="button">클릭하세요!</button>
    </section>
  </main>
</body>
</html>
