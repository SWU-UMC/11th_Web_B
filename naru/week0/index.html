<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>양지애 자기소개</title>

  <style>
    .card {
      width: 80%;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    h1 {
      color: #2563eb;
      font-size: 32px;
    }

    p {
      color: #666;
    }

    .skills {
      display: flex;
      gap: 20px;
    }

    button {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
    }

    button:hover {
      background-color: #1d4ed8;
    }
  </style>
</head>

<body>
  <main class="card">
    <header>
      <h1>양지애</h1>
      <p>디지털미디어학과 23학번 양지애입니다.</p>
    </header>

    <section>
      <h2>배우고 싶은 기술</h2>
      <ul class="skills">
        <li>Spring Boot</li>
        <li>React</li>
        <li>JavaScript</li>
      </ul>
    </section>

    <section>
      <h2>자주 방문하는 사이트</h2>
      <a href="https://github.com/" target="_blank">GitHub 바로가기</a>
    </section>

    <section>
      <h2>버튼</h2>
      <p id="message">버튼을 눌러 주세요.</p>
      <button id="greeting-button" type="button">클릭하세요!</button>
    </section>
  </main>

  <script>
    console.log("Hello, Web!");

    const student = {
      name: "양지애",
      skills: ["Spring Boot", "React", "JavaScript"]
    };

    function printSkills(skills) {
      for (const skill of skills) {
        if (skill === "JavaScript") {
          console.log(`${skill}: 화면에 동작을 더합니다.`);
        } else {
          console.log(skill);
        }
      }
    }

    console.log(student.name);
    printSkills(student.skills);

    const message = document.querySelector("#message");
    const greetingButton = document.querySelector("#greeting-button");

    greetingButton.addEventListener("click", function () {
      message.textContent = "웹 개발을 시작합니다!";
    });
  </script>
</body>
</html>
